<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 - Yopo</title>
    <meta name="description" content="Yopo 的留言板：想说的话、想问的问题、想指出的错误，都可以留在这里。" />
    <link rel="alternate" type="application/rss+xml" title="Yopo 的博客" href="/feed.xml" />
    <meta name="author" content="Yopo" />
    <meta property="og:title" content="留言板 - Yopo" />
    <meta property="og:description" content="想说的话、想问的问题、想指出的错误，都可以留在这里。" />
    <meta property="og:image" content="/img/map.jpg" />
    <link rel="icon" href="/img/my-avatar.jpg" type="image/jpeg">
    <link href="/lib/remixicon.css?v=45" rel="stylesheet">
    <script src="theme-init.js?v=45"></script>
    <link rel="stylesheet" href="css/base.css?v=45" />
    <link rel="stylesheet" href="css/home.css?v=45" />
    <link rel="stylesheet" href="css/blog.css?v=45" />
    <link rel="stylesheet" href="css/post.css?v=45" />
    <link rel="stylesheet" href="css/admin.css?v=45" />
    <link rel="stylesheet" href="css/site.css?v=45" />
</head>
<body class="blog-page">

<div id="global-nav"></div>

    <main id="main-content" class="container blog-container blog-page">
        <header class="blog-hero fade-in">
            <h1>留言板<span>。</span></h1>
            <p>想说的话、想问的问题、想指出的错误，都可以留在这儿。<br class="blog-mobile-break">和评论一样，<strong>先审后上墙</strong>，提交后不会立刻出现。</p>
            <div class="blog-hero-foot">
                <span class="blog-hero-rule" aria-hidden="true"></span>
                <span>已有留言</span>
                <span class="blog-hero-total"><strong id="guestbook-count">—</strong> 条</span>
            </div>
        </header>

        <section class="blog-library fade-in" aria-label="留言板">
            <form id="guestbook-form" class="comment-form" autocomplete="off">
                <label class="comment-label" for="guestbook-nickname">昵称</label>
                <input id="guestbook-nickname" class="comment-nickname" name="nickname" maxlength="30" required placeholder="已经帮你取好了，可以改" />
                <label class="comment-label" for="guestbook-content">留言</label>
                <textarea id="guestbook-content" class="comment-content" name="content" maxlength="1000" required placeholder="想说的、想问的、想纠错的，都行"></textarea>
                <!-- 蜜罐字段：页面上不可见，被填了一定是机器人；后端会假成功但不落库 -->
                <input class="comment-honeypot" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
                <div class="comment-form-footer">
                    <span id="guestbook-status" class="comment-status" role="status" aria-live="polite"></span>
                    <button id="guestbook-submit" class="comment-submit" type="submit">留下这条</button>
                </div>
            </form>

            <p class="blog-list-status" id="guestbook-loading" role="status" aria-live="polite">正在载入留言</p>
            <ul id="guestbook-list" class="comment-list"></ul>
        </section>

        <div id="global-footer"></div>
        <script src="/footer.js?v=45" type="module"></script>
    </main>

    <script src="/nav.js?v=45" type="module"></script>
    <script src="/keys.js?v=45" type="module"></script>
    <script src="/reveal.js?v=45" type="module"></script>

    <script src="guestbook.js?v=45" type="module"></script>
</body>
</html>
