<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Yopo 博客文章管理" />
    <title>文章管理 · Yopo</title>
    <link rel="icon" href="/img/my-avatar.jpg" type="image/jpeg" />
    <link href="/lib/remixicon.css?v=55" rel="stylesheet" />
    <script src="/theme-init.js?v=55"></script>
    <link rel="stylesheet" href="css/base.css?v=55" />
    <link rel="stylesheet" href="css/home.css?v=55" />
    <link rel="stylesheet" href="css/blog.css?v=55" />
    <link rel="stylesheet" href="css/post.css?v=55" />
    <link rel="stylesheet" href="css/admin.css?v=55" />
    <link rel="stylesheet" href="css/site.css?v=55" />
  </head>
  <body class="admin-page">
    <div id="global-nav"></div>

    <main id="main-content" class="container admin-container">
      <header class="admin-hero">
        <h1>文章管理<span>。</span></h1>
        <p>整理想法，更新你的博客。</p>
      </header>

      <section id="admin-auth" class="admin-auth-card" aria-labelledby="admin-auth-title">
        <h2 id="admin-auth-title">进入管理工作台</h2>
        <p>输入服务器上的管理令牌。令牌仅保存在当前页面内存中，刷新或关闭标签后会清除。</p>
        <form id="admin-auth-form" class="admin-auth-form">
          <label for="admin-token">管理令牌</label>
          <div class="admin-token-row">
            <input id="admin-token" name="token" type="password" autocomplete="current-password" required placeholder="粘贴 ADMIN_TOKEN" />
            <button class="admin-primary-button" type="submit">验证并进入</button>
          </div>
        </form>
        <p id="admin-auth-status" class="admin-status" role="status" aria-live="polite"></p>
      </section>

      <section id="admin-workspace" class="admin-workspace" hidden>
        <div class="admin-workspace-heading">
          <div>
            <h2>你的文章</h2>
          </div>
          <button id="admin-lock" class="admin-quiet-button" type="button">退出管理</button>
        </div>

        <div class="admin-layout">
          <section class="admin-editor-card" aria-labelledby="admin-editor-title">
            <div class="admin-section-heading">
              <div>
                <p class="admin-editor-mode" id="admin-editor-mode">新文章</p>
                <h3 id="admin-editor-title">写一篇新文章</h3>
              </div>
              <button id="admin-reset" class="admin-text-button" type="button">清空</button>
            </div>

            <form id="admin-post-form" class="admin-post-form">
              <label for="post-title">标题</label>
              <input id="post-title" name="title" maxlength="200" required placeholder="给这篇文章一个标题" />

              <div class="admin-field-grid">
                <div>
                  <label for="post-tags">标签</label>
                  <input id="post-tags" name="tags" maxlength="1000" placeholder="例如：前端, 随笔" />
                </div>
                <div>
                  <label for="post-cover">封面图片（可选）</label>
                  <input id="post-cover" name="cover" maxlength="2048" placeholder="https://…" />
                </div>
              </div>

              <label for="post-content">正文 <span class="admin-label-note">支持 Markdown</span></label>
              <textarea id="post-content" name="content" required placeholder="# 写下你的想法…"></textarea>
              <div class="admin-editor-footer">
                <span id="admin-char-count">0 字符</span>
                <div class="admin-editor-actions">
                  <button id="admin-cancel-edit" class="admin-quiet-button" type="button" hidden>取消编辑</button>
                  <button id="admin-save" class="admin-primary-button" type="submit">发布文章</button>
                </div>
              </div>
            </form>
            <p id="admin-form-status" class="admin-status" role="status" aria-live="polite"></p>
          </section>

          <section class="admin-list-card" aria-labelledby="admin-list-title">
            <div class="admin-section-heading">
              <div>
                <h3 id="admin-list-title">已发布</h3>
              </div>
              <span id="admin-post-count" class="admin-count">—</span>
            </div>
            <div id="admin-post-list" class="admin-post-list" aria-live="polite">
              <p class="admin-list-placeholder">正在读取文章…</p>
            </div>
          </section>
        </div>

        <section class="admin-comments-card" aria-labelledby="admin-comments-title">
          <div class="admin-section-heading">
            <div>
              <h3 id="admin-comments-title">评论审核</h3>
            </div>
            <div class="admin-comments-tools">
              <select id="admin-comment-filter" aria-label="评论状态筛选">
                <option value="pending">待审核</option>
                <option value="approved">已显示</option>
                <option value="rejected">已拒绝</option>
                <option value="all">全部</option>
              </select>
              <button id="admin-comments-clear" class="admin-text-button" type="button">清空待审</button>
              <button id="admin-comments-refresh" class="admin-text-button" type="button">刷新</button>
              <span id="admin-comment-count" class="admin-count">—</span>
            </div>
          </div>
          <div id="admin-comment-list" class="admin-comment-list" aria-live="polite">
            <p class="admin-list-placeholder">正在读取评论…</p>
          </div>
          <p id="admin-comment-status" class="admin-status" role="status" aria-live="polite"></p>
        </section>

        <section class="admin-comments-card" aria-labelledby="admin-guestbook-title">
          <div class="admin-section-heading">
            <div>
              <h3 id="admin-guestbook-title">留言板审核</h3>
            </div>
            <div class="admin-comments-tools">
              <select id="admin-guestbook-filter" aria-label="留言状态筛选">
                <option value="pending">待审核</option>
                <option value="approved">已显示</option>
                <option value="rejected">已拒绝</option>
                <option value="all">全部</option>
              </select>
              <button id="admin-guestbook-refresh" class="admin-text-button" type="button">刷新</button>
              <span id="admin-guestbook-count" class="admin-count">—</span>
            </div>
          </div>
          <div id="admin-guestbook-list" class="admin-comment-list" aria-live="polite">
            <p class="admin-list-placeholder">正在读取留言…</p>
          </div>
          <p id="admin-guestbook-status" class="admin-status" role="status" aria-live="polite"></p>
        </section>

        <section class="admin-editor-card" aria-labelledby="admin-config-title">
          <div class="admin-section-heading">
            <div>
              <p class="admin-editor-mode">站点配置</p>
              <h3 id="admin-config-title">首页卡片图</h3>
            </div>
          </div>
          <div class="admin-form-field">
            <label for="admin-config-project">项目卡背景（LCP 预置图三选一）</label>
            <select id="admin-config-project">
              <option value="">默认（图三 project-3）</option>
              <option value="project-1">图一 project-1</option>
              <option value="project-2">地图 map.jpg</option>
              <option value="project-3">图三 project-3</option>
            </select>
          </div>
          <div class="admin-form-field">
            <label>壁纸卡精选池（不勾 = 全量轮换；最多 30 张）</label>
            <div id="admin-config-wallpapers" class="admin-config-wallpapers"></div>
          </div>
          <div class="admin-editor-actions">
            <button id="admin-config-save" class="admin-action-button" type="button">保存站点配置</button>
            <span id="admin-config-status" class="admin-status" role="status" aria-live="polite"></span>
          </div>
        </section>

        <section class="admin-editor-card" aria-labelledby="admin-now-title">
          <div class="admin-section-heading">
            <div>
              <p class="admin-editor-mode">当前快照</p>
              <h3 id="admin-now-title">「现在」页</h3>
            </div>
            <span id="admin-now-updated" class="admin-count">—</span>
          </div>
          <form id="admin-now-form" class="admin-post-form">
            <label for="now-doing">在做 <span class="admin-label-note">每行一条</span></label>
            <textarea id="now-doing" name="doing" maxlength="2000" placeholder="最近主要在忙的一件事，一两句就够"></textarea>
            <label for="now-reading">在读</label>
            <textarea id="now-reading" name="reading" maxlength="2000" placeholder="最近在读的书或文章"></textarea>
            <label for="now-tinkering">在折腾</label>
            <textarea id="now-tinkering" name="tinkering" maxlength="2000" placeholder="最近在玩的工具、硬件、想法"></textarea>
            <div class="admin-editor-footer">
              <span id="admin-now-status" class="admin-status" role="status" aria-live="polite"></span>
              <div class="admin-editor-actions">
                <button id="admin-now-save" class="admin-primary-button" type="submit">保存「现在」</button>
              </div>
            </div>
          </form>
        </section>

        <section class="admin-editor-card" aria-labelledby="admin-shorts-title">
          <div class="admin-section-heading">
            <div>
              <p class="admin-editor-mode">发布即上线</p>
              <h3 id="admin-shorts-title">短记</h3>
            </div>
            <span id="admin-shorts-count" class="admin-count">—</span>
          </div>
          <form id="admin-shorts-form" class="admin-post-form">
            <label for="admin-shorts-content">新短记 <span class="admin-label-note">一句一条，最多 500 字</span></label>
            <textarea id="admin-shorts-content" maxlength="500" required placeholder="不成文章的零碎想法，一句就够"></textarea>
            <div class="admin-editor-footer">
              <span id="admin-shorts-status" class="admin-status" role="status" aria-live="polite"></span>
              <div class="admin-editor-actions">
                <button id="admin-shorts-submit" class="admin-primary-button" type="submit">发布短记</button>
              </div>
            </div>
          </form>
          <div id="admin-shorts-list" class="admin-comment-list" aria-live="polite">
            <p class="admin-list-placeholder">登录后显示短记。</p>
          </div>
        </section>
      </section>

      <div id="global-footer"></div>
      <script src="/footer.js?v=55" type="module"></script>
    </main>

    <script src="/nav.js?v=55" type="module"></script>
    <script src="/keys.js?v=55" type="module"></script>
    <script src="/admin.js?v=55" type="module"></script>
  </body>
</html>
