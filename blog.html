<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 - Yopo</title>
    <meta name="description" content="自己搭的博客：代码、工具和日常。" />
    <link rel="alternate" type="application/rss+xml" title="Yopo 的博客" href="/feed.xml" />
    <meta name="author" content="Yopo" />
    <meta property="og:title" content="Yopo 的博客 - 思维碎片" />
    <meta property="og:description" content="记录代码旅程与生活点滴。" />
    <meta property="og:image" content="https://cdn.jsdelivr.net/gh/LLllCCC/tuchaung@main/img/map.jpg" />
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/LLllCCC/tuchaung@main/img/my-avatar.jpg" type="image/jpeg">
    <link href="https://cdn.staticfile.net/remixicon/3.5.0/remixicon.css" rel="stylesheet">
    <script src="theme-init.js?v=27"></script>
    <link rel="stylesheet" href="style.css?v=27">
</head>
<body>

<div id="global-nav"></div>

    <main id="main-content" class="container blog-container blog-page">
        <header class="blog-hero fade-in">
            <h1>思维碎片<span>。</span></h1>
            <p>关于代码、设计与日常的记录。<br class="blog-mobile-break">慢慢写，慢慢积累。</p>
            <div class="blog-hero-foot">
                <span class="blog-hero-rule" aria-hidden="true"></span>
                <span>随笔与开发记录</span>
                <span class="blog-hero-total"><strong id="blog-total-count">—</strong> 篇文章</span>
            </div>
        </header>

        <section class="blog-library fade-in" aria-label="博客文章">
            <div class="blog-toolbar">
                <label class="blog-search">
                    <i class="ri-search-line" aria-hidden="true"></i>
                    <input type="search" id="blog-search" placeholder="搜索标题或摘要…" aria-label="搜索文章标题或摘要">
                    <span class="blog-search-hint" aria-hidden="true">⌕</span>
                </label>
                <p class="blog-list-status" id="blog-result-count" role="status" aria-live="polite">正在载入文章</p>
            </div>

            <div class="tag-cloud" id="tag-cloud" aria-label="按标签筛选"></div>

            <div class="article-list" id="dynamic-article-list">
                <p class="blog-empty-state" role="status" aria-live="polite">正在加载文章…</p>
            </div>
        </section>

        <div id="global-footer"></div>
        <script src="/footer.js?v=27" type="module"></script>
    </main>

    <script src="/nav.js?v=27" type="module"></script>

    <script src="/blog.js?v=27" type="module"></script>
</body>
</html>
