<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>现在 - Yopo</title>
    <meta name="description" content="Yopo 此刻在做、在读、在折腾的事。" />
    <link rel="alternate" type="application/rss+xml" title="Yopo 的博客" href="/feed.xml" />
    <meta name="author" content="Yopo" />
    <meta property="og:title" content="现在 - Yopo" />
    <meta property="og:description" content="此刻在做、在读、在折腾的事。" />
    <meta property="og:image" content="/img/map.jpg" />
    <link rel="icon" href="/img/my-avatar.jpg" type="image/jpeg">
    <link href="/lib/remixicon.css?v=56" rel="stylesheet">
    <script src="theme-init.js?v=56"></script>
    <link rel="stylesheet" href="css/base.css?v=56" />
    <link rel="stylesheet" href="css/home.css?v=56" />
    <link rel="stylesheet" href="css/blog.css?v=56" />
    <link rel="stylesheet" href="css/post.css?v=56" />
    <link rel="stylesheet" href="css/admin.css?v=56" />
    <link rel="stylesheet" href="css/site.css?v=56" />
</head>
<body>

<div id="global-nav"></div>

    <main id="main-content" class="container blog-container blog-page">
        <header class="blog-hero fade-in">
            <h1>现在<span>。</span></h1>
            <p>这一页写的不是简历，也<strong>不是长期有效的</strong>——它只描述此刻。<br class="blog-mobile-break">过一阵子没更新，就说明它过期了。</p>
            <div class="blog-hero-foot">
                <span class="blog-hero-rule" aria-hidden="true"></span>
                <span>最后更新</span>
                <span class="blog-hero-total"><strong id="now-updated">—</strong></span>
            </div>
        </header>

        <!-- 内容由 now.js 从 /api/now 动态拉取填充。
             三块对应后端 doing / reading / tinkering 字段；
             空字段那块整段隐藏。改内容走 /admin.html 的「现在」编辑区。 -->
        <div class="now-panel fade-in" id="now-panel">
            <section class="now-block" data-now-block data-field="doing">
                <h2>在做</h2>
                <ul><li>（载入中…）</li></ul>
            </section>

            <section class="now-block" data-now-block data-field="reading">
                <h2>在读</h2>
                <ul><li>（载入中…）</li></ul>
            </section>

            <section class="now-block" data-now-block data-field="tinkering">
                <h2>在折腾</h2>
                <ul><li>（载入中…）</li></ul>
            </section>
        </div>

        <div class="blog-toolbar" style="justify-content:center; margin-top:10px;">
            <a class="blog-post-link" href="/blog.html" style="text-decoration:none;">← 回到文章列表</a>
        </div>

        <div id="global-footer"></div>
        <script src="/footer.js?v=56" type="module"></script>
    </main>

    <script src="/nav.js?v=56" type="module"></script>
    <script src="/keys.js?v=56" type="module"></script>
    <script src="/reveal.js?v=56" type="module"></script>

    <script src="now.js?v=56" type="module"></script>
</body>
</html>
