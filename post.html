<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正在加载文章... - Yopo</title>
    <meta name="description" content="阅读 Yopo 的技术文章与生活随笔。" />
    <link rel="alternate" type="application/rss+xml" title="Yopo 的博客" href="/feed.xml" />
    <meta name="author" content="Yopo" />

    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://yopoo.888431.xyz/" />
    <meta property="og:title" content="Yopo 的博客文章" />
    <meta property="og:description" content="分享技术见解与生活感悟。" />
    <meta property="og:image" content="/img/map.jpg" />

    <link rel="icon" href="/img/my-avatar.jpg" type="image/jpeg" />

    <link href="/lib/remixicon.css?v=32" rel="stylesheet" />

    <script src="theme-init.js?v=32"></script>

    <link rel="stylesheet" href="css/base.css?v=32" />
    <link rel="stylesheet" href="css/home.css?v=32" />
    <link rel="stylesheet" href="css/blog.css?v=32" />
    <link rel="stylesheet" href="css/post.css?v=32" />
    <link rel="stylesheet" href="css/admin.css?v=32" />
    <link rel="stylesheet" href="css/site.css?v=32" />
    <script src="/lib/marked.min.js?v=32" defer></script>
    <script src="/lib/purify.min.js?v=32" defer></script>
    <link rel="stylesheet" href="/lib/github-dark.min.css?v=32" />
    <script src="/lib/highlight.min.js?v=32" defer></script>
  </head>
  <body>
    <div id="global-nav"></div>

    <main id="main-content">
      <div class="reading-progress" aria-hidden="true"><span id="reading-progress-bar"></span></div>
      <article class="article-page" role="main">
        <header class="article-hero">
          <a class="article-back" href="/blog.html">← 返回博客</a>
          <figure class="article-hero-cover" id="article-cover" tabindex="0" role="group" aria-label="文章封面图片，可以拖动调整显示位置" hidden>
            <span class="article-hero-cover-backdrop" aria-hidden="true"></span>
            <img id="article-cover-image" alt="" />
            <span class="article-cover-hint">拖动图片调整取景</span>
          </figure>
          <h1 id="article-title">加载中...</h1>
          <div class="article-meta-row">
            <time id="article-date"></time><span class="article-meta-dot">·</span>
            <span id="article-read-time">阅读时间计算中</span>
            <span id="article-tags" class="article-tag-list"></span>
          </div>
        </header>

        <div class="article-layout">
          <aside class="article-toc" id="article-toc"></aside>
          <div class="article-main">
            <div id="article-body" class="post-content"></div>
            <div id="article-neighbors" class="article-neighbors" role="navigation" aria-label="相邻文章" hidden></div>
            <div id="article-reactions" class="article-reactions" hidden></div>
          <div id="article-comments">
            <div class="comments-title">评论<span id="comments-count" class="comments-count"></span></div>
            <form id="comment-form" class="comment-form" autocomplete="off">
              <label class="comment-label" for="comment-nickname">昵称</label>
              <input id="comment-nickname" class="comment-nickname" name="nickname" maxlength="30" required placeholder="已经帮你取好了，可以改" />
              <label class="comment-label" for="comment-content">留言</label>
              <div class="comment-replying" id="comment-replying" hidden>
                <span class="comment-replying-text" id="comment-replying-text"></span>
                <button class="comment-replying-cancel" type="button" id="comment-replying-cancel">取消回复</button>
              </div>
              <textarea id="comment-content" class="comment-content" name="content" maxlength="1000" required placeholder="说点什么…（留言会先经过审核再显示）"></textarea>
              <input class="comment-honeypot" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
              <div class="comment-form-footer">
                <span id="comment-status" class="comment-status" role="status" aria-live="polite"></span>
                <button id="comment-submit" class="comment-submit" type="submit">提交评论</button>
              </div>
            </form>
            <div class="comment-sort" id="comment-sort" role="group" aria-label="评论排序"></div>
            <ul id="comment-list" class="comment-list" aria-live="polite"></ul>
          </div>
        </div>
          </div>
        </div>
      </article>
      <div id="global-footer"></div>
    </main>

    <script src="/footer.js?v=32" type="module"></script>
    <script src="/nav.js?v=32" type="module"></script>
    <script src="post.js?v=32" type="module"></script>
  </body>
</html>
