<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Yopo 的主页 - Web 开发与生活随笔</title>
    <meta
      name="description"
      content="你好，我是 Yopo。分享 HTML/CSS 前端开发、Docker 运维教程以及生活中的思维碎片。"
    />
    <meta name="keywords" content="Yopo, 个人主页, Web 开发, Docker 教程" />
    <meta name="author" content="Yopo" />
    <link rel="alternate" type="application/rss+xml" title="Yopo 的博客" href="/feed.xml" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yopoo.888431.xyz/" />
    <meta property="og:title" content="Yopo 的主页" />
    <meta
      property="og:description"
      content="便当盒布局的个人主页：页面、博客和评论系统都是自己写的。"
    />
    <meta
      property="og:image"
      content="/img/map.jpg"
    />

    <link rel="icon" href="/img/my-avatar.jpg" type="image/jpeg" />

    <!-- 首页最大内容绘制（LCP）元素是 #my-projects 卡片的 CSS 背景图，提前预加载 -->
    <link rel="preload" as="image" href="/img/project-3.jpg" fetchpriority="high" />

    <link
      href="/lib/remixicon.css?v=46"
      rel="stylesheet"
    />

    <script src="theme-init.js?v=46"></script>

    <link rel="stylesheet" href="css/base.css?v=46" />
    <link rel="stylesheet" href="css/home.css?v=46" />
    <link rel="stylesheet" href="css/blog.css?v=46" />
    <link rel="stylesheet" href="css/post.css?v=46" />
    <link rel="stylesheet" href="css/admin.css?v=46" />
    <link rel="stylesheet" href="css/site.css?v=46" />
  </head>

  <body class="index-page">
    <div id="global-nav"></div>

    <main id="main-content" class="container">
      <div class="grid">
        <div id="home" class="card card-hero fade-in delay-01">
          <div class="hero-text">
            <h1>自己搭的<br />网站。</h1>
            <p>你好，我是 Yopo。页面、后端和评论系统都自己写，跑在自己买的 VPS 上。</p>
          </div>
          <img src="/img/my-avatar.jpg" alt="Yopo's Avatar" class="avatar" />
        </div>

        <div class="card card-social-container fade-in delay-02">
          <a
            href="https://github.com/LLllCCC"
            target="_blank"
            rel="noopener noreferrer"
            class="card-social-flip"
          >
            <div class="flip-front">
              <i class="ri-github-fill"></i>
              <span>GitHub</span>
            </div>
            <div class="flip-back">
              <img
                src="/img/github-back.jpg"
                alt="个人头像"
                class="mini-avatar"
              />
              <span>LLllCCC</span>
            </div>
          </a>
        </div>

        <div class="card card-social-container fade-in delay-03">
          <a
            href="mailto:z.daisy-cn@foxmail.com"
            class="card-social-flip email-card"
          >
            <div class="flip-front">
              <i class="ri-mail-send-fill"></i>
              <span>Email</span>
            </div>
            <div class="flip-back email-back">
              <i class="ri-at-line email-back-icon"></i>
              <span class="email-back-address">z.daisy-cn<br />@foxmail.com</span>
            </div>
          </a>
        </div>

        <a
          id="my-projects"
          class="card card-project fade-in bg-project-3 delay-04"
          href="/site.html"
          aria-label="看这个网站是怎么搭的"
        >
          <div class="project-info">
            <div class="project-title">这个网站是怎么搭的</div>
            <div class="project-desc">技术栈、跑在哪、改一次要经过什么、都改过什么</div>
          </div>
        </a>

        <a
          id="home-blog-card"
          class="card card-blog fade-in delay-05"
          href="/blog.html"
          aria-label="打开 Yopo 的博客"
        >
          <div class="project-info">
            <div class="project-title" id="home-blog-title">博客</div>
            <div class="project-desc" id="home-blog-desc">最近写的一篇</div>
            <div class="home-blog-badge-wrap">
              <span class="home-blog-badge">去看博客</span>
            </div>
          </div>
        </a>

        <a
          class="card card-motion-web fade-in delay-05"
          href="/motion-web/cases/"
          aria-label="打开 Motion Web 动效案例展示"
        >
          <span class="motion-web-title">动效实验</span>
          <span class="motion-web-description">7 个可交互的动画 demo</span>
        </a>

        <!-- 新增页面的三张入口卡：数字由 main.js 动态填（标签数 / 壁纸数），
             拉不到就保持占位文案，不阻塞也不报错。 -->
        <a class="card card-mini fade-in delay-06" href="/tag.html" aria-label="按标签翻文章">
          <div class="project-info">
            <div class="project-title"><i class="ri-price-tag-3-fill card-mini-icon" aria-hidden="true"></i>标签</div>
            <div class="project-desc">按主题翻文章</div>
            <div class="home-blog-badge-wrap"><span class="home-blog-badge" id="home-tag-badge">全部标签</span></div>
          </div>
        </a>

        <a class="card card-mini fade-in delay-06" href="/stats.html" aria-label="看写作统计">
          <div class="project-info">
            <div class="project-title"><i class="ri-bar-chart-grouped-fill card-mini-icon" aria-hidden="true"></i>统计</div>
            <div class="project-desc">字数、热力图、标签分布</div>
            <div class="home-blog-badge-wrap"><span class="home-blog-badge">写作地图</span></div>
          </div>
        </a>

        <!-- 壁纸卡带照片轮换：两张 img 交替淡入淡出（main.js 驱动），
             图源是壁纸页的本地缩略图（约 45KB/张），加载无压力。 -->
        <a class="card card-mini card-mini--photo fade-in delay-06" href="/gallery.html" aria-label="看壁纸集">
          <img class="card-mini-photo" alt="" aria-hidden="true" />
          <img class="card-mini-photo" alt="" aria-hidden="true" />
          <div class="project-info">
            <div class="project-title"><i class="ri-landscape-fill card-mini-icon" aria-hidden="true"></i>壁纸</div>
            <div class="project-desc">收集的手机壁纸</div>
            <div class="home-blog-badge-wrap"><span class="home-blog-badge" id="home-gallery-badge">壁纸集</span></div>
          </div>
        </a>

        <!-- 页脚里每个真实页面都该在主页有入口：归档、留言板这两张补齐。 -->
        <a class="card card-mini card-mini--wide fade-in delay-06" href="/archive.html" aria-label="看文章归档">
          <div class="project-info">
            <div class="project-title"><i class="ri-archive-2-fill card-mini-icon" aria-hidden="true"></i>归档</div>
            <div class="project-desc">按年份和月份翻全部文章</div>
            <div class="home-blog-badge-wrap"><span class="home-blog-badge" id="home-archive-badge">全部文章</span></div>
          </div>
        </a>

        <a class="card card-mini card-mini--wide fade-in delay-06" href="/guestbook.html" aria-label="去留言板说两句">
          <div class="project-info">
            <div class="project-title"><i class="ri-chat-3-fill card-mini-icon" aria-hidden="true"></i>留言板</div>
            <div class="project-desc">想说的话、想纠的错，都在这儿</div>
            <div class="home-blog-badge-wrap"><span class="home-blog-badge">先审后上墙</span></div>
          </div>
        </a>
      </div>

      <div id="global-footer"></div>
      <script src="/footer.js?v=46" type="module"></script>
    </main>

    <script src="/nav.js?v=46" type="module"></script>
    <script src="/keys.js?v=46" type="module"></script>
    <script src="/reveal.js?v=46" type="module"></script>
    <script src="main.js?v=46" type="module"></script>
  </body>
</html>
