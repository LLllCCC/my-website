<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Yopo 的主页</title>
    <meta
      name="description"
      content="你好，我是 Yopo。一名热爱 Web 开发的探索者。"
    />
    <meta name="keywords" content="Yopo, 个人主页, Web 开发" />
    <meta name="author" content="Yopo" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yopo.888431.xyz/" />
    <meta property="og:title" content="Yopo 的主页" />
    <meta
      property="og:description"
      content="基于 Apple Style 打造的极简个人主页。"
    />
    <meta
      property="og:image"
      content="https://cdn.jsdelivr.net/gh/LLllCCC/tuchaung@main/img/map.jpg"
    />

    <link
      rel="icon"
      href="https://cdn.jsdelivr.net/gh/LLllCCC/tuchaung@main/img/my-avatar.jpg"
      type="image/jpeg"
    />

    <link
      href="https://cdn.staticfile.net/remixicon/3.5.0/remixicon.css"
      rel="stylesheet"
    />

    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="global-nav"></div>

    <main>
      <!-- Hero -->
      <section class="hero" id="hero">
        <div class="hero-content">
          <h1 class="hero-title fade-up" style="--delay: 0.15s">
            创意无限，<br />代码不止。
          </h1>
          <p class="hero-subtitle fade-up" style="--delay: 0.35s">
            你好，我是 Yopo。一名热爱 Web 开发的探索者
          </p>
          <div class="hero-avatar-wrap fade-up" style="--delay: 0.55s">
            <img
              src="https://cdn.jsdelivr.net/gh/LLllCCC/tuchaung@main/img/my-avatar.jpg"
              alt="Yopo"
              class="hero-avatar"
            />
          </div>
        </div>
        <div class="scroll-indicator fade-up" style="--delay: 0.75s">
          <i class="ri-arrow-down-line"></i>
        </div>
      </section>

      <!-- Cards -->
      <section class="cards-section" id="cards">
        <div class="cards-grid">
          <a
            href="https://github.com/LLllCCC"
            target="_blank"
            rel="noopener"
            class="bento-card reveal"
          >
            <i class="ri-github-fill card-icon"></i>
            <div class="card-body">
              <div class="card-title">GitHub</div>
              <div class="card-desc">@LLllCCC</div>
            </div>
          </a>

          <a href="mailto:z.daisy-cn@foxmail.com" class="bento-card reveal">
            <i class="ri-mail-send-fill card-icon"></i>
            <div class="card-body">
              <div class="card-title">Email</div>
              <div class="card-desc">z.daisy-cn@foxmail.com</div>
            </div>
          </a>
        </div>
      </section>

      <!-- Friends -->
      <section class="friends-section reveal">
        <span class="friends-label">友情链接</span>
        <div class="friends-links">
          <a href="https://github.com" target="_blank" rel="noopener"
            >GitHub</a
          >
          <span class="dot">·</span>
          <a href="https://www.cloudflare.com" target="_blank" rel="noopener"
            >Cloudflare</a
          >
        </div>
      </section>

      <!-- Footer -->
      <footer class="site-footer">
        <p>&copy; 2026 Yopo. Designed with Apple Style.</p>
      </footer>
    </main>

    <script src="/config.js" defer></script>
    <script src="/nav.js" defer></script>
    <script src="main.js" defer></script>
  </body>
</html>
