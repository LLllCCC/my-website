<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="按年份和月份浏览 Yopo 写过的所有文章。" />
    <link rel="alternate" type="application/rss+xml" title="Yopo 的博客" href="/feed.xml" />
    <meta name="author" content="Yopo" />
    <meta property="og:title" content="归档 - Yopo" />
    <meta property="og:description" content="按年份和月份浏览全部文章。" />
    <meta property="og:image" content="/img/map.jpg" />
    <link rel="icon" href="/img/my-avatar.jpg" type="image/jpeg">
    <link href="/lib/remixicon.css?v=34" rel="stylesheet">
    <script src="theme-init.js?v=34"></script>
    <link rel="stylesheet" href="css/base.css?v=34" />
    <link rel="stylesheet" href="css/home.css?v=34" />
    <link rel="stylesheet" href="css/blog.css?v=34" />
    <link rel="stylesheet" href="css/post.css?v=34" />
    <link rel="stylesheet" href="css/admin.css?v=34" />
    <link rel="stylesheet" href="css/site.css?v=34" />
</head>
<body class="blog-page">

<div id="global-nav"></div>

    <main id="main-content" class="container blog-container blog-page">
        <header class="blog-hero fade-in">
            <h1>归档<span>。</span></h1>
            <p>按时间和年份翻看写过的每一篇。<br class="blog-mobile-break">一共 <strong id="archive-total-count">—</strong> 篇，最早一篇在 <strong id="archive-earliest">—</strong>。</p>
            <div class="blog-hero-foot">
                <span class="blog-hero-rule" aria-hidden="true"></span>
                <span>全部文章</span>
                <span class="blog-hero-total"><strong id="archive-year-count">—</strong> 个年份</span>
            </div>
        </header>

        <section class="blog-library fade-in" aria-label="文章归档">
            <div class="archive-toolbar">
                <div class="archive-years" id="archive-years" role="group" aria-label="按年份筛选"></div>
                <label class="blog-search">
                    <i class="ri-search-line" aria-hidden="true"></i>
                    <input type="search" id="archive-search" placeholder="搜索标题、摘要…" aria-label="搜索文章标题或摘要">
                    <span class="blog-search-hint" aria-hidden="true">⌕</span>
                </label>
            </div>

            <p class="blog-list-status" id="archive-result-count" role="status" aria-live="polite">正在载入文章</p>

            <div class="archive-groups" id="archive-groups">
                <p class="blog-empty-state" role="status" aria-live="polite">正在加载文章…</p>
            </div>

            <div class="blog-toolbar" style="justify-content:center; margin-top:10px;">
                <a class="blog-post-link" href="/blog.html" style="text-decoration:none;">← 回到文章列表</a>
            </div>
        </section>

        <div id="global-footer"></div>
        <script src="/footer.js?v=34" type="module"></script>
    </main>

    <script src="/nav.js?v=34" type="module"></script>

    <script src="archive.js?v=34" type="module"></script>
</body>
</html>
